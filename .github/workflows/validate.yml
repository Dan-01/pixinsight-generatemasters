name: Validate GenerateMasters repository
on: [pull_request, push, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tools/test-release.py
      - name: Validate update feed
        run: python3 tools/validate-repository.py updates
